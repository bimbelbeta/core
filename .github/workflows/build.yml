# For more details, read this: https://coolify.io/docs/github-actions
name: Build
on:
  push:
    branches: ["main"]
    paths:
      - "apps/web/**"
      - "apps/server/**"
      - "packages/**"
      - "scripts/**"
      - "turbo.json"
      - "package.json"
      - "biome.json"
      - "bun.lock"
      - "bunfig.toml"
      - "apps/web/Dockerfile"
      - "apps/server/Dockerfile"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Login to ghcr.io
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.TOKEN }}
      - name: Build image and push to registry
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/web/Dockerfile
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/bimbelbeta/web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          build-args: |
            TURBO_TEAM=${{ secrets.TURBO_TEAM }}
            TURBO_TOKEN=${{ secrets.TURBO_TOKEN }}
            VITE_SERVER_URL=https://api.bimbelbeta.com
            VITE_MIDTRANS_CLIENT_KEY=${{ secrets.MIDTRANS_CLIENT_KEY }}
            VITE_PAYMENTS_ENABLED=${{ vars.VITE_PAYMENTS_ENABLED }}
      - name: Deploy to Coolify
        if: github.ref == 'refs/heads/main'
        run: |
          curl --fail-with-body --request POST '${{ secrets.COOLIFY_WEB_WEBHOOK }}' \
            --header 'Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}'

  build-server:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Login to ghcr.io
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.TOKEN }}
      - name: Build image and push to registry
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/server/Dockerfile
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/bimbelbeta/server:latest
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
          build-args: |
            TURBO_TEAM=${{ secrets.TURBO_TEAM }}
            TURBO_TOKEN=${{ secrets.TURBO_TOKEN }}
      - name: Deploy to Coolify
        if: github.ref == 'refs/heads/main'
        run: |
          curl --fail-with-body --request POST '${{ secrets.COOLIFY_SERVER_WEBHOOK }}' \
            --header 'Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}'
