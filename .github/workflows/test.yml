name: Test
on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.0-alpine
        env:
          POSTGRES_DB: bimbelbeta
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/bimbelbeta
      TEST_DATABASE_URL: postgresql://postgres:password@localhost:5432/bimbelbeta
      MIDTRANS_SERVER_KEY: test-server-key
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bunx drizzle-kit push --force
        working-directory: packages/db
      - run: bun build:packages
      - run: bun check-types
      - run: bunx biome check .
      - run: bun test
