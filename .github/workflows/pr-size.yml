name: PR Size

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  label:
    name: Label PR size
    runs-on: ubuntu-latest
    concurrency:
      group: pr-size-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      # This pull_request_target job may fetch untrusted PR commits only as passive
      # git data. Do not add dependency installs, build/test scripts, or cache
      # actions here.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/github-script@v8
        with:
          script: |
            const { execFileSync } = require("node:child_process");

            const managedLabels = [
              { name: "size:XS", color: "0e8a16", description: "0-9 effective changed lines (test files excluded in mixed PRs)." },
              { name: "size:S", color: "5ebd3e", description: "10-29 effective changed lines (test files excluded in mixed PRs)." },
              { name: "size:M", color: "fbca04", description: "30-99 effective changed lines (test files excluded in mixed PRs)." },
              { name: "size:L", color: "fe7d37", description: "100-499 effective changed lines (test files excluded in mixed PRs)." },
              { name: "size:XL", color: "d93f0b", description: "500-999 effective changed lines (test files excluded in mixed PRs)." },
              { name: "size:XXL", color: "b60205", description: "1,000+ effective changed lines (test files excluded in mixed PRs)." },
            ];
            const managedLabelNames = new Set(managedLabels.map((l) => l.name));

            for (const label of managedLabels) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ...label,
                });
              }
            }

            const issueNumber = context.payload.pull_request.number;
            const baseSha = context.payload.pull_request.base.sha;
            const headSha = context.payload.pull_request.head.sha;
            const headTrackingRef = `refs/remotes/pr-size/${issueNumber}`;

            execFileSync("git", ["fetch", "--no-tags", "origin", baseSha], { stdio: "inherit" });
            execFileSync(
              "git",
              ["fetch", "--no-tags", "origin", `+refs/pull/${issueNumber}/head:${headTrackingRef}`],
              { stdio: "inherit" },
            );

            const diffArgs = [
              "diff",
              "--numstat",
              "--ignore-all-space",
              "--ignore-blank-lines",
              `${baseSha}...${headTrackingRef}`,
            ];
            const testExcludePathspecs = [
              ":(glob,exclude)**/__tests__/**",
              ":(glob,exclude)**/test/**",
              ":(glob,exclude)**/tests/**",
              ":(glob,exclude)**/*.test.*",
              ":(glob,exclude)**/*.spec.*",
            ];

            const sumNumstat = (text) =>
              text
                .split("\n")
                .filter(Boolean)
                .reduce((total, line) => {
                  const [addRaw = "0", delRaw = "0"] = line.split("\t");
                  return (
                    total +
                    (addRaw === "-" ? 0 : Number.parseInt(addRaw, 10) || 0) +
                    (delRaw === "-" ? 0 : Number.parseInt(delRaw, 10) || 0)
                  );
                }, 0);

            const totalChangedLines = sumNumstat(execFileSync("git", diffArgs, { encoding: "utf8" }));
            const nonTestChangedLines = sumNumstat(
              execFileSync("git", [...diffArgs, "--", ".", ...testExcludePathspecs], { encoding: "utf8" }),
            );
            const testChangedLines = Math.max(0, totalChangedLines - nonTestChangedLines);
            const changedLines = nonTestChangedLines === 0 ? testChangedLines : nonTestChangedLines;

            const resolveSizeLabel = (lines) =>
              lines < 10 ? "size:XS"
              : lines < 30 ? "size:S"
              : lines < 100 ? "size:M"
              : lines < 500 ? "size:L"
              : lines < 1000 ? "size:XL"
              : "size:XXL";
            const nextLabelName = resolveSizeLabel(changedLines);

            const { data: currentLabels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            });

            for (const label of currentLabels) {
              if (!managedLabelNames.has(label.name) || label.name === nextLabelName) continue;
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name: label.name,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            if (!currentLabels.some((label) => label.name === nextLabelName)) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: [nextLabelName],
              });
            }

            core.info(
              `PR #${issueNumber}: ${nonTestChangedLines} non-test lines, ${testChangedLines} test lines, ${changedLines} effective -> ${nextLabelName}`,
            );
